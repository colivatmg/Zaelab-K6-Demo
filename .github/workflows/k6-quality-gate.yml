# Quality Gate: runs guard.js on every pull request.
# Juice Shop is started as a service INSIDE the workflow (no dependency on
# any public demo instance). K6 points at http://localhost:3000.
# If a threshold is crossed -> exit code != 0 -> check RED -> PR blocked.
name: K6 Quality Gate

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/k6-quality-gate.yml'
  # Manual trigger
  workflow_dispatch:

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Juice Shop (container has no curl; the runner does)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/products >/dev/null && echo "ready" && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/products >/dev/null

      - name: Install k6
        # Official binary from the Grafana k6 releases, installed into
        # /usr/local/bin (always on the runner's PATH). Pinned to the same
        # v1 series as the local dev environment for reproducible results.
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/v1.7.1/k6-v1.7.1-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo install /tmp/k6-v1.7.1-linux-amd64/k6 /usr/local/bin/k6

      - name: Verify k6 is available
        run: k6 version

      - name: Run K6 guard (blocks PR on threshold failure)
        # k6 v1 has no --base-url flag; the script reads __ENV.BASE_URL.
        run: BASE_URL=http://localhost:3000 k6 run scripts/guard.js

# Note: do NOT use --health-cmd with curl on the service, because the
# health-cmd runs INSIDE the container and the Juice Shop image does not
# include curl. That is why the wait happens from a runner step instead.
